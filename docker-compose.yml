services:
  # PostgreSQL Database
  db:
    image: postgres:latest
    container_name: ${DB_HOST}
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:${DB_PORT}"
    networks:
      - tombola-net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # API Server
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: tombola-api
    environment:
      NODE_ENV: development
      HOST: ${API_HOST}
      PORT: ${API_PORT}
      API_KEY_STRIPE: ${API_KEY_STRIPE}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${API_PORT}:${API_PORT}"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./apps/api/src:/app/src
      - ./apps/api/dist:/app/dist
    networks:
      - tombola-net
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:${API_PORT}/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend Server
  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    container_name: tombola-frontend
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - api
    networks:
      - tombola-net
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost/ || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres-data:
    driver: local

networks:
  tombola-net:
    driver: bridge
