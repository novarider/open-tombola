services:
  # PostgreSQL Database
  db:
    image: postgres:latest
    container_name: tombola-db
    hostname: tombola-db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: tombola
    ports:
      - "5432:5432"
    networks:
      - tombola-net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U tombola" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # API Server
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: tombola-api
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 3333
      DATABASE_URL: postgresql://tombola:tombola-dev-password@db:5432/tombola
      API_KEY_STRIPE: invalid_key_placeholder
      DB_HOST: tombola-db
      DB_PORT: 5432
      DB_USERNAME: user
      DB_PASSWORD: password
    ports:
      - "3333:3333"
      #depends_on:
      #db:
      #  condition: service_healthy
    volumes:
      - ./apps/api/src:/app/src
      - ./apps/api/dist:/app/dist
    networks:
      - tombola-net
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3333/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend Server
  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    container_name: tombola-frontend
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - api
    volumes:
      - ./apps/frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - tombola-net
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost/ || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres-data:
    driver: local

networks:
  tombola-net:
    driver: bridge
