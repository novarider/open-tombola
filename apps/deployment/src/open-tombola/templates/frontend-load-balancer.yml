apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-load-balancer
  labels:
    app: {{ .Release.Name }}-frontend
  namespace: {{ .Values.namespace }}
spec:
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
      name: http
  selector:
    app: {{ .Release.Name }}-frontend
