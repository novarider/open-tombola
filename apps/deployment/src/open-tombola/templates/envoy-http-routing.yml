# This file contains the base resources that the docs/user/HTTP_ROUTING.md guide relies on.
# This includes a GatewayClass, Gateway, Services and Deployments that are used as backends
# for routing traffic.
kind: GatewayClass
apiVersion: gateway.networking.k8s.io/v1
metadata:
  name: eg
  labels:
    application: {{ .Release.Name }}
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Release.Name }}-gateway
  labels:
    application: {{ .Release.Name }}
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
  namespace: {{ .Values.namespace }}
spec:
  gatewayClassName: eg
  listeners:
    - name: http
      protocol: HTTP
      port: 80
    - name: https-api
      protocol: HTTPS
      hostname: {{ .Values.backendHostname }}
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: eg-https-api
    - name: https-frontend
      protocol: HTTPS
      hostname: {{ .Values.frontendHostname }}
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: eg-https-frontend
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: tls-redirect
  namespace: {{ .Values.namespace }}
spec:
  parentRefs:
    - name: {{ .Release.Name }}-gateway
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api-route
  labels:
    application: {{ .Release.Name }}
  namespace: {{ .Values.namespace }}
spec:
  parentRefs:
    - name: {{ .Release.Name }}-gateway
      sectionName: https-api
  hostnames:
    - {{ .Values.backendHostname }}
  rules:
    - backendRefs:
        - name: {{ .Release.Name }}-service
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: frontend-route
  labels:
    application: {{ .Release.Name }}
  namespace: {{ .Values.namespace }}
spec:
  parentRefs:
    - name: {{ .Release.Name }}-gateway
      sectionName: https-frontend
  hostnames:
    - {{ .Values.frontendHostname }}
  rules:
    - backendRefs:
        - name: {{ .Release.Name }}-load-balancer
          port: 80
