apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-database-deployment
  labels:
    app: {{ .Release.Name }}-database
  namespace: {{ .Values.namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-database
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-database
    spec:
      containers:
        - name: {{ .Release.Name }}-database
          image: postgres
          envFrom:
            - secretRef:
                name: env-database
          ports:
            - containerPort: 5432
