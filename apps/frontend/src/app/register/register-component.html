<h2>Alpschwein Verlosung 2026</h2>

<form (submit)="onSubmit($event)">
    <app-personal-data-form [field]="registerForm.personalData"></app-personal-data-form>

    <h3>Wie viele Lose möchten Sie kaufen? (Stückpreis 2,50€)</h3>
    <app-tickets-form [field]="registerForm.tickets"></app-tickets-form>

    <div class="add-ticket-buttons">
        <button type="button" class="button secondary" data-testid="add-1-ticket" (click)="addEmptyTickets(1)">1 Los
            hinzufügen</button>
        <button type="button" class="button secondary" data-testid="add-10-tickets" (click)="addEmptyTickets(10)">10 Lose
            hinzufügen (25,00€)</button>
        <button type="button" class="button secondary" data-testid="add-20-tickets" (click)="addEmptyTickets(20)">20 Lose
            hinzufügen (50,00€)</button>
    </div>

    <div class="submit-button-wrapper">
        <button type="submit" class="button primary" data-testid="buy-tickets">Lose kaufen</button>
    </div>
</form>
